name: Keep API awake

# Backup for the API's own self-pinger: if the free instance restarts and
# falls asleep, it can't wake itself, so an outside request does it.
# GitHub may delay scheduled runs by a few minutes under load.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint (allows ~90 s for a cold start)
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 \
            https://resume-customizer-api-m69l.onrender.com/api/v1/health
