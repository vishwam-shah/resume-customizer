[project]
name = "backend"
version = "0.1.0"
description = "Resume Customizer API: parse, tailor and score resumes against a job description"
authors = [
    { name = "Vishwam Shah", email = "vishwamshah007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "google-genai>=2.30.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pymupdf-fonts>=1.0.5",
    "python-docx>=1.2.0",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
]


[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
