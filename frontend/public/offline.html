<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · Tailor</title>
    <meta name="theme-color" content="#09090b" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #09090b; --muted: #52525b; --border: #8b8b94; }
      @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #adadb5; --border: #71717a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 26rem; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 1.5rem; letter-spacing: -0.01em; margin: 20px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--fg); color: var(--bg); cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Tailoring needs an internet connection. Your job description and resume are saved in this browser, so nothing is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
